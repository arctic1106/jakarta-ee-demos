<div id="id_list_inprog_cargoes" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
    <div class="section-heading">
        <div>
            <h2>Routed cargo</h2>
            <p>Active shipments with an assigned itinerary.</p>
        </div>
    </div>

    <h:dataTable var="cargo" value="#{listCargo.routedUnclaimedCargos}" style="text-align: center; width: 100%;">
        <h:column>
            <f:facet name="header">Tracking ID</f:facet>
            <h:link value="#{cargo.trackingId.idString}" id="trackingId" outcome="/admin/show.xhtml"
                    style="text-decoration: none;" title="Click to see itinerary's details.">
                <f:param name="trackingId" value="#{cargo.trackingId.idString}"/>
            </h:link>
        </h:column>

        <h:column>
            <f:facet name="header">Origin</f:facet>
            <h:outputText value="#{cargo.origin.name}  "/><br/>
            <h:outputText value="#{cargo.origin.unLoCode.code}" style="color: #999999;font-size:.8em;"/>
        </h:column>

        <h:column>
            <f:facet name="header">Destination</f:facet>
            <h:outputText value="#{cargo.routeSpecification.destination.name}"/><br/>
            <h:outputText value="#{cargo.routeSpecification.destination.unLoCode.code}" style="color: #999999;font-size:.8em;"/>
        </h:column>

        <h:column>
            <f:facet name="header">Last Known Location</f:facet>
            <h:outputText value="#{cargo.delivery.lastKnownLocation.name}"/><br/>
            <h:outputText value="#{cargo.delivery.lastKnownLocation.unLoCode.code}" style="color: #999999;font-size:.8em;"
                          rendered="#{!cargo.delivery.lastKnownLocation.unLoCode.code.contains('XXXX')}"/>
        </h:column>

        <h:column>
            <f:facet name="header">Status</f:facet>
            <h:outputText value="#{cargo.delivery.transportStatus}"/>
        </h:column>
        <h:column>
            <f:facet name="header">Deadline</f:facet>
            <h:outputText value="#{cargo.routeSpecification.arrivalDeadline}"/>
        </h:column>
    </h:dataTable>
</div>
