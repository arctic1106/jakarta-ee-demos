<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="trackingId" value="#{changeArrivalDeadline.trackingId}"/>
    <f:viewAction action="#{changeArrivalDeadline.load}"/>
</f:metadata>
<h:head>
    <title>Change Arrival Deadline</title>
    <h:outputStylesheet name="css/app.css"/>
</h:head>
<h:body>
    <main class="standalone-main">
        <h:form styleClass="panel">
            <p class="page-kicker">Cargo update</p>
            <h1>Change arrival deadline</h1>
            <h:panelGrid columns="2" cellpadding="30">
                <h:outputLabel value="Origin:"/>
                <h:outputText value="#{changeArrivalDeadline.cargo.origin.name}"/>
                <h:outputLabel value="Destination:"/>
                <h:outputText value="#{changeArrivalDeadline.cargo.routeSpecification.destination.name}"/>
                <h:outputLabel value="New Deadline (yyyy-MM-dd):"/>
                <h:inputText id="deadline" value="#{changeArrivalDeadline.arrivalDeadline}">
                    <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                </h:inputText>
                <h:commandButton value="Cancel" action="/admin/dashboard?faces-redirect=true" immediate="true"/>
                <h:commandButton value="Update" action="#{changeArrivalDeadline.changeArrivalDeadline()}"/>
            </h:panelGrid>
        </h:form>
    </main>
</h:body>
</html>
