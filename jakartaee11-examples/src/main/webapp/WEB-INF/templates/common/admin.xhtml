<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<!-- View metadata slot. Template clients must supply the <f:metadata> element
     themselves, inside <ui:define name="metadata">: Faces ignores an <f:metadata>
     that lives in the template file, so view params and view actions never run. -->
<ui:insert name="metadata"/>

<h:head>
    <title><ui:insert name="title">Cargo Tracker</ui:insert> · Cargo Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1728" />
    <h:outputStylesheet name="css/app.css" />
</h:head>

<h:body>
    <div class="app-shell">
        <aside class="app-sidebar">
            <a class="app-brand" href="#{request.contextPath}/">
                <h:graphicImage value="#{resource['images/CTlogobadge128.png']}" alt="" />
                <span class="app-brand-copy">
                    <strong>Cargo Tracker</strong>
                    <small>Operations</small>
                </span>
            </a>
            <p class="app-nav-label">Workspace</p>
            <nav aria-label="Operations navigation">
                <ul id="side-sub-menu" class="app-nav">
                    <li><a href="#{request.contextPath}/admin/dashboard.xhtml">Dashboard</a></li>
                    <li><h:link outcome="booking" value="Book cargo" /></li>
                    <li><a href="#{request.contextPath}/admin/tracking/track.xhtml">Track cargo</a></li>
                    <li><a href="#{request.contextPath}/admin/tracking/map.xhtml">Live map</a></li>
                    <li><a href="#{request.contextPath}/admin/system-load.xhtml">System load</a></li>
                    <li><a href="#{request.contextPath}/admin/about.xhtml">About</a></li>
                </ul>
            </nav>
            <div class="app-sidebar-footer">Jakarta EE 11 reference application</div>
        </aside>

        <main class="app-main">
            <header class="app-topbar">
                <div>
                    <span class="app-topbar-kicker">Operations workspace</span>
                    <h1 class="app-topbar-title"><ui:insert name="title">Cargo Tracker</ui:insert></h1>
                </div>
                <a href="#{request.contextPath}/" class="app-home-link">Home</a>
            </header>
            <section class="app-content">
                <h:messages globalOnly="true" styleClass="app-messages" infoClass="app-message-info"
                            errorClass="app-message-error"/>
                <ui:insert name="content">Default Content</ui:insert>
            </section>
        </main>
    </div>
    <h:outputScript name="js/topbar.min.js"/>
    <h:outputScript name="js/progress.js"/>
</h:body>
</html>
