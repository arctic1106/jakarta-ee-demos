<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/WEB-INF/templates/common/admin.xhtml">
    <ui:define name="title">Cargo Registration</ui:define>
    <ui:define name="content">
        <div class="content-narrow" id="mainCol">
            <div class="page-intro">
                <p class="page-kicker">Step 2 of 3</p>
                <h2>Choose the destination</h2>
                <p>Select where the cargo leaving #{booking.originName} should arrive.</p>
            </div>
            <h:form>
                <h:outputLabel for="destination" value="Destination location"/>
                <br/>
                <h:selectOneMenu id="destination" value="#{booking.destinationUnlocode}"
                                 required="true" requiredMessage="Select a destination location.">
                    <f:selectItem itemLabel="Select a destination" itemValue="" noSelectionOption="true"/>
                    <f:selectItems value="#{booking.locations}" var="loc" itemLabel="#{loc.name} " itemValue="#{loc.unLoCode.code}"/>
                </h:selectOneMenu>
                <hr/>
                <h:panelGrid columns="3" styleClass="registrationPanelGrid" style="margin: 0 auto;">
                    <h:commandButton value="Back" action="booking"/>
                    <h:commandButton value="Cancel" action="returnFromBookingFlow" immediate="true"/>
                    <h:commandButton value="Next" action="booking-date"/>
                </h:panelGrid>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
</html>
