# MicroProfile Config defaults. Override with environment variables, e.g.
#   CARGO_PATHFINDER_MAX_CANDIDATES=3
# (dots and dashes become underscores, upper case), or with server.xml / bootstrap.properties.

# Upper bound of route candidates returned by the path finder (GraphTraversalService).
cargo.pathfinder.max-candidates=5

# MicroProfile Fault Tolerance annotations are configurable too, without recompiling:
#   <fully.qualified.Class>/<method>/<Annotation>/<attribute>=<value>
cargotracker.service.RoutingService/fetchRoutesForSpecification/Timeout/value=3
